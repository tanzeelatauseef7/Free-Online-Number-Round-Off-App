<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Round Off App</title>

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }

    .card {
        background: #fff;
        width: 100%;
        max-width: 400px;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        text-align: center;
    }

    h1 {
        font-size: 22px;
        margin-bottom: 20px;
        color: #333;
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #5a67d8;
    }

    .result {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        color: #333;
        background: #f7f7f7;
        padding: 12px;
        border-radius: 8px;
    }

    footer {
        margin-top: 15px;
        font-size: 12px;
        color: #888;
    }
</style>
</head>
<body>

<div class="card">
    <h1>🔢 Number Round Off Tool</h1>

    <input type="number" id="numberInput" placeholder="Enter a number" step="any">

    <select id="roundType">
        <option value="nearest">Round to Nearest</option>
        <option value="up">Round Up</option>
        <option value="down">Round Down</option>
    </select>

    <input type="number" id="decimals" placeholder="Decimal places (e.g. 2)" min="0">

    <button onclick="roundNumber()">Round Now</button>

    <div class="result" id="result">Result will appear here</div>

    <footer>Free Online Number Round Off App</footer>
</div>

<script>
function roundNumber() {
    const number = parseFloat(document.getElementById("numberInput").value);
    const type = document.getElementById("roundType").value;
    const decimals = parseInt(document.getElementById("decimals").value) || 0;

    if (isNaN(number)) {
        document.getElementById("result").innerText = "⚠️ Please enter a valid number";
        return;
    }

    const factor = Math.pow(10, decimals);
    let result;

    if (type === "up") {
        result = Math.ceil(number * factor) / factor;
    } else if (type === "down") {
        result = Math.floor(number * factor) / factor;
    } else {
        result = Math.round(number * factor) / factor;
    }

    document.getElementById("result").innerText = `✅ Rounded Result: ${result}`;
}
</script>

</body>
</html>
